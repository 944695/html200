<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Rolodex Card</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<main class="page-wrap">
			<article class="profile-card" aria-label="Professional profile card">
				<section class="profile-sidebar">
					<img
						class="avatar"
                        src="instructor-bio-image3.png"
						alt="Portrait of Steve Smith"
					/>
					<h1>Steve Smith</h1>
					<p class="role">Project Manager</p>
				</section>

				<section class="profile-details" aria-label="Contact details">
					<ul>
						<li><strong>Company:</strong> Front End Dev Co</li>
						<li><strong>Experience:</strong> 3 years</li>
						<li><strong>School:</strong> UW</li>
						<li><strong>Major:</strong> Marketing</li>
						<li><strong>Email:</strong> <a href="mailto:steve@fedc.com">steve@fedc.com</a></li>
						<li class="linkedin-row">
							<span class="linkedin-icon" aria-hidden="true">in</span>
							<a href="#" aria-label="Steve Smith LinkedIn profile">steve.linkedinprofile.com</a>
						</li>
					</ul>
				</section>
			</article>
		</main>
	</body>
</html>
